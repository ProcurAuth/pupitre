# The status playbook of the unit relay. It only reads the hosts (4.26).
- name: Read the state of the relay configuration
  hosts: relay_hosts
  gather_facts: false
  tasks:
    - name: Read the configuration file
      ansible.builtin.slurp:
        src: /tmp/pupitre-example/relay.conf
      register: relay_file
      failed_when: false

    - name: Show the state
      ansible.builtin.debug:
        msg: "{{ 'relay.conf is present' if relay_file.content is defined else 'relay.conf is absent' }}"
