name: docs

# Check the rules of ASD-STE100 in each Markdown file of the repository (8.8).
# The check makes no network request, and it builds nothing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the documents
        run: scripts/check.sh --docs
