[package]
name = "pupitre"
description = "Pupitre: a web console for the configuration of services and their Ansible runs. One static binary with the server and the command line tools."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "pupitre"
path = "src/lib.rs"

[[bin]]
name = "pupitre"
path = "src/main.rs"

[dependencies]
hclconf.workspace = true
pupitre-core.workspace = true
pupitre-store.workspace = true
pupitre-runner.workspace = true
tokio.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
sha2.workspace = true
getrandom.workspace = true
serde_json.workspace = true
procurauth-pep.workspace = true
procurauth-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
