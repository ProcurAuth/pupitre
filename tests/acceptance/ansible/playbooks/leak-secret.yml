---
# Playbook of the command `leak-secret` (4.21). It prints secrets on purpose, with no `no_log`.
# The scrubber MUST replace each value in the stored output and in the stored events.
# The mode `print` prints the password. The mode `fail` fails with the password and the token in the message.
- name: Print the secrets of the unit
  hosts: all
  gather_facts: false
  vars:
    leak_files: "{{ (pupitre_secret_files | default({})).get(pupitre_units | first, pupitre_secret_files | default({})) }}"
    leak_password: "{{ lookup('ansible.builtin.file', leak_files['storage.password']) }}"
    leak_token: "{{ lookup('ansible.builtin.file', leak_files['api.token']) }}"
  tasks:
    - name: Print the password
      ansible.builtin.debug:
        msg: "login with password {{ leak_password }}"
      when: pupitre_params.mode == 'print'

    - name: Fail with the secrets in the message
      ansible.builtin.fail:
        msg: "login failed for password {{ leak_password }} and token {{ leak_token }}"
      when: pupitre_params.mode == 'fail'
