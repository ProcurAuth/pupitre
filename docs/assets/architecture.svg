<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-label="Architecture of Pupitre: a browser and an edge in front of one static binary with the HTTP server, the access guard, the catalog, the store and the runner, and the managed hosts over SSH">
  <title>Architecture of the single binary</title>
  <desc>The browser reaches the edge or the proxy. The edge sends the request to Pupitre. Inside Pupitre, the HTTP server calls the access guard. The guard asks the PDP in the mode authzen. The catalog reads the store, which is a folder or PostgreSQL. The runner node builds a snapshot and starts ansible-playbook, which reaches the hosts over SSH.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a5b4fc"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="1100" height="640" rx="20" fill="#12142a"/>
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">One binary: page, access guard, catalog, store and runner</text>
    <text x="40" y="82" font-size="15" font-weight="400" fill="#9ca3d4" text-anchor="start">Pupitre is one static program. It serves the page from memory and starts Ansible only on the runner node.</text>
    <rect x="36" y="270" width="120" height="80" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="96.0" y="298" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">Browser</text>
    <text x="96.0" y="320" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">the page comes</text>
    <text x="96.0" y="337" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">from Pupitre</text>
    <rect x="196" y="270" width="130" height="80" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="261.0" y="298" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">Edge or proxy</text>
    <text x="261.0" y="320" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">authenticates the</text>
    <text x="261.0" y="337" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">person (mode open)</text>
    <path d="M156 310H194" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M326 310H378" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <rect x="380" y="100" width="560" height="500" rx="16" fill="#171a38" stroke="#4338ca" stroke-width="2"/>
    <text x="400" y="128" font-size="16" font-weight="700" fill="#a5b4fc" text-anchor="start">pupitre</text>
    <rect x="410" y="150" width="150" height="70" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="485.0" y="178" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">HTTP server</text>
    <text x="485.0" y="200" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">main and ops listeners</text>
    <rect x="610" y="150" width="150" height="70" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="685.0" y="178" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">Access guard</text>
    <text x="685.0" y="200" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">token check</text>
    <text x="685.0" y="217" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">question to the PDP</text>
    <rect x="410" y="270" width="150" height="70" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="485.0" y="298" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">Catalog</text>
    <text x="485.0" y="320" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">documents in memory</text>
    <text x="485.0" y="337" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">polls the store</text>
    <rect x="410" y="390" width="150" height="70" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="485.0" y="418" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">Store</text>
    <text x="485.0" y="440" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">one trait, two backends</text>
    <rect x="610" y="270" width="150" height="70" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="685.0" y="298" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">Runner</text>
    <text x="685.0" y="320" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">only on the runner node</text>
    <rect x="610" y="390" width="150" height="70" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="685.0" y="418" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">Snapshot</text>
    <text x="685.0" y="440" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">inventory, variables,</text>
    <text x="685.0" y="457" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">hash of the manifest</text>
    <rect x="610" y="500" width="150" height="70" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="685.0" y="528" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">ansible-playbook</text>
    <text x="685.0" y="550" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">--check --diff, then apply</text>
    <rect x="410" y="500" width="68" height="60" rx="12" fill="#12142a" stroke="#4338ca" stroke-width="1.5"/>
    <text x="444.0" y="528" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">files</text>
    <text x="444.0" y="550" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">folder</text>
    <rect x="486" y="500" width="74" height="60" rx="12" fill="#12142a" stroke="#4338ca" stroke-width="1.5"/>
    <text x="523.0" y="528" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">postgres</text>
    <text x="523.0" y="550" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">tables</text>
    <path d="M560 185H608" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M685 220V268" stroke="#a5b4fc" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <path d="M485 340V388" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M485 460V498" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M685 340V388" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M685 460V498" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M608 425H562" stroke="#a5b4fc" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <text x="826" y="188" font-size="14" font-weight="700" fill="#e0e7ff" text-anchor="start">PDP</text>
    <text x="826" y="206" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="start">(mode authzen)</text>
    <path d="M760 185H820" stroke="#a5b4fc" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <rect x="980" y="270" width="90" height="80" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="1025.0" y="298" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">Hosts</text>
    <text x="1025.0" y="320" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">managed</text>
    <text x="1025.0" y="337" font-size="12" font-weight="400" fill="#c7d2fe" text-anchor="middle">hosts</text>
    <path d="M760 535H870V350H978" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#ag)"/>
    <text x="884" y="450" font-size="13" font-weight="700" fill="#34d399" text-anchor="start">SSH</text>
    <text x="40" y="620" font-size="13" font-weight="400" fill="#9ca3d4" text-anchor="start">Dashed arrows are optional or conditional. The green arrow is the only path to the hosts.</text>
  </g>
</svg>
