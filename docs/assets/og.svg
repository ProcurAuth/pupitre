  <g transform="translate(90 150) scale(7)"><rect width="32" height="32" rx="8" fill="#4338ca"/><path d="M9 7h14l3 9H6z" fill="#ffffff"/><path d="M10.2 10h11.6M9.4 12.8h13.2" stroke="#4338ca" stroke-width="1.6" stroke-linecap="round"/><rect x="14.5" y="16" width="3" height="6" fill="#ffffff"/><rect x="9" y="22" width="14" height="3" rx="1.5" fill="#ffffff"/></g>
